name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Hide API routes for static export
        run: mv app/api /tmp/api_backup

      - name: Build static site for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_API_URLS: https://booksharev2.vercel.app

      - name: Ensure Jekyll is disabled
        run: touch out/.nojekyll

      - name: Tell Vercel to ignore gh-pages branch
        run: |
          cat > out/vercel.json <<'EOF'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "git": {
              "deploymentEnabled": false
            }
          }
          EOF

      - name: Restore API routes
        if: always()
        run: mv /tmp/api_backup app/api

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
          clean: true
          single-commit: true
